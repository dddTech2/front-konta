<!-- Favicon del sitio. No es el isotipo tal cual: el anillo original mide 7,6
     unidades de grosor sobre 1325 (0,57 % del ancho), que a 16 px equivale a
     0,09 px y se deshace en un borrón gris. Se sustituye por un disco macizo
     con el monograma calado -el par positivo/negativo del manual-, que es lo
     unico legible a tamano de pestana. En pestanas oscuras se invierte. -->
