# Pruebas y despliegue automático de la SPA de Konta.
#
# En cada push a master: corre las pruebas (Vitest) y el build y, si pasan, entra por SSH al VPS y ejecuta
# el script de despliegue del backend (back-konta/scripts/deploy.sh front), que actualiza este repo y
# recompila la SPA que sirve la API. También se puede lanzar a mano desde Actions.
#
# Usa los mismos secretos que back-konta: VPS_HOST, VPS_USER, VPS_SSH_KEY y VPS_KNOWN_HOSTS
# (ver back-konta/docs/DEPLOYMENT.md, sección "Despliegue automático").
name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: konta-deploy-front
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verificar secretos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing (ver back-konta/docs/DEPLOYMENT.md)"
            exit 1
          fi
      - name: Preparar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Desplegar en el VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # El script vive en back-konta: se actualiza ese repo primero para usar su versión más reciente.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -e; cd /opt/dianProyect/back-konta && git fetch --quiet origin main && git reset --quiet --hard origin/main && bash scripts/deploy.sh front"
      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
