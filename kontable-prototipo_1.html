<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3431">
<title>Kontable — Prototipo navegable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde: #1E3431;
    --verde-suave: #2E4E49;
    --verde-tint: #4C7768;
    --terracota: #BC5539;
    --terracota-dark: #8C3D28;
    --beige: #DFD0C3;
    --gris-claro: #F4F4F2;
    --blanco: #FFFFFF;
    --gris-oscuro: #333333;
    --gris-medio: #7A7A76;
    --font-display: 'Newsreader', serif;
    --font-body: 'Inter', sans-serif;
    --safe-top: 58px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family: var(--font-body);
    background: #E7E2D9;
    color: var(--gris-oscuro);
    min-height:100vh;
  }

  /* ---------- demo switcher (meta, outside the product) ---------- */
  #demo-bar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap;
    background:#2A2A28; color:#DDDAD3;
    padding:10px 16px; font-size:12.5px; font-family: var(--font-body);
  }
  #demo-bar .label{opacity:.65; letter-spacing:.02em;}
  .demo-toggle{ display:flex; background:#3A3A37; border-radius:999px; padding:3px; gap:2px;}
  .demo-toggle button{
    border:none; background:transparent; color:#B9B6AE; font-family:var(--font-body);
    font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer;
    transition: all .2s ease;
  }
  .demo-toggle button.active{ background:var(--beige); color:var(--verde); }
  #demo-bar .reset{
    border:1px solid #55534E; background:transparent; color:#B9B6AE; border-radius:999px;
    padding:6px 13px; font-size:12px; cursor:pointer; font-family:var(--font-body);
  }
  #demo-bar .reset:hover{ border-color:#8A8880; color:#fff; }

  /* ---------- stage / phone frame ---------- */
  #stage{ display:flex; justify-content:center; padding: 40px 16px 60px; }
  .phone-frame{
    width:390px; height:844px; background:#111; border-radius:52px;
    padding:14px; box-shadow: 0 30px 60px rgba(0,0,0,.28), 0 8px 20px rgba(0,0,0,.15);
    position:relative; flex-shrink:0;
  }
  .phone-inner{ position:relative; width:100%; height:100%; background:var(--gris-claro); border-radius:38px; overflow:hidden; }
  .phone-notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#111; border-radius:0 0 18px 18px; z-index:30;
  }
  .statusbar{
    position:absolute; top:0; left:0; right:0; height:var(--safe-top); z-index:20;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 26px 6px; font-size:13px; font-weight:600; font-family:var(--font-body);
    color:inherit; pointer-events:none;
  }
  .screen-wrapper{ position:absolute; inset:0; display:flex; flex-direction:column; }
  .screen-content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .screen-content::-webkit-scrollbar{ display:none; }

  /* ---------- bottom nav ---------- */
  .bottom-nav{
    flex-shrink:0; display:flex; align-items:stretch; height:78px;
    background:var(--blanco); border-top:1px solid #E7E4DD;
    padding-bottom:14px;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    border:none; background:none; cursor:pointer; font-family:var(--font-body);
    color:var(--gris-medio); font-size:11px; font-weight:600; padding-top:10px;
  }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item.active{ color:var(--verde); }
  .nav-item .dot{ position:relative; top:-14px; left:9px; width:7px; height:7px; }

  /* ---------- generic ---------- */
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
    font-size:11.5px; font-weight:600; font-family:var(--font-body);
  }
  svg.icon{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  svg.icon.icon-xs{ width:14px; height:14px; }
  .card{ background:var(--blanco); border-radius:18px; padding:16px; }
  .h-title{ font-family:var(--font-display); color:var(--verde); }
  .backrow{ display:flex; align-items:center; gap:10px; padding:calc(var(--safe-top) + 12px) 20px 4px; font-family:var(--font-body); font-weight:600; color:var(--verde); }
  .backrow button{ border:none; background:var(--beige); color:var(--verde); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* buttons */
  .btn-primary{
    width:100%; border:none; background:var(--terracota); color:#fff; font-family:var(--font-body);
    font-weight:700; font-size:15px; padding:15px; border-radius:14px; cursor:pointer;
    transition: transform .12s ease, opacity .2s;
  }
  .btn-primary:active{ transform:scale(.98); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-outline{
    width:100%; border:1.5px solid var(--terracota-dark); background:transparent; color:var(--terracota-dark);
    font-family:var(--font-body); font-weight:700; font-size:14.5px; padding:13px; border-radius:14px; cursor:pointer;
  }

  ::selection{ background:var(--beige); }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .pulse{ animation: pulse 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<div id="demo-bar">
  <span class="label">KONTABLE — vista:</span>
  <div class="demo-toggle">
    <button id="btn-mode-emprendedor" onclick="setMode('emprendedor')">Emprendedor</button>
    <button id="btn-mode-admin" onclick="setMode('admin')">Admin · Katerinn</button>
  </div>
  <span id="api-status-pill" style="display:inline-flex; align-items:center; gap:5px; background:#3A3A37; color:#A7D7C5; padding:5px 10px; border-radius:999px; font-size:11.5px; font-weight:600;">
    <span class="dot" style="background:#4C7768;"></span> API Kontable
  </span>
  <button class="reset" onclick="syncWithBackend()" title="Sincronizar datos con backend FastAPI">🔄 Sincronizar API</button>
  <button id="btn-lockout-sim" class="reset" onclick="simulateLockoutToggle()" style="color:#F9A897; border-color:#8C3D28;">Simular Bloqueo 403</button>
  <button class="reset" onclick="resetDemo()">Reiniciar</button>
</div>

/* =========================================================
   CONFIGURACIÓN API Y ESTADO
========================================================= */
const API_BASE = window.KONTABLE_API_BASE || 'http://127.0.0.1:8000';

let S = {
  mode:'emprendedor',
  loggedIn:false,
  view:'dashboard',
  negocioActivo:'diseno',
  periodoIdx:0,
  adminFiltro:'todos',
  adminSelected:null,
  subscription:null,
  suspensionDetail:null,
  apiOnline:false,
  historialGroup:'Todas',
  historialSearch:'',
  simulatingLockout:false,
  telegramBotUsername:null,
};

async function syncWithBackend(nitOrId){
  if(S.simulatingLockout) return;
  const target = nitOrId || (DB.negocios.diseno ? DB.negocios.diseno.nit : '901234567');
  const pill = document.getElementById('api-status-pill');
  try {
    const res = await fetch(`${API_BASE}/api/dashboard/${target}`);
    
    if (res.status === 403) {
      const err = await res.json();
      S.suspensionDetail = err.detail || err;
      S.view = 'suspended';
      if(pill) pill.innerHTML = `<span class="dot" style="background:#BC5539;"></span> Cuenta Suspendida (403)`;
      render();
      return;
    }
    
    if (res.ok) {
      const data = await res.json();
      if (data.business) {
        DB.negocios.diseno.nombre = data.business.commercial_name;
        DB.negocios.diseno.nit = data.business.nit;
        DB.negocios.diseno.actividad = data.business.economic_activity;
      }
      if (data.resumen) {
        DB.negocios.diseno.resumen = data.resumen;
      }
      if (data.historico && data.historico.length > 0) {
        DB.negocios.diseno.historico = data.historico;
      }
      if (data.facturasRecientes && data.facturasRecientes.length > 0) {
        DB.negocios.diseno.facturasRecientes = data.facturasRecientes;
      }
      S.subscription = data.suscripcion;
      S.apiOnline = true;
      if(pill) pill.innerHTML = `<span class="dot" style="background:#4C7768;"></span> API Kontable (Online)`;

      try {
        const resIva = await fetch(`${API_BASE}/api/iva/${target}`);
        if (resIva.ok) {
          const dataIva = await resIva.json();
          if (dataIva.periodos && dataIva.periodos.length > 0) {
            DB.negocios.diseno.periodosIVA = dataIva.periodos;
          }
        }
      } catch(e) {}

      try {
        const resInv = await fetch(`${API_BASE}/api/invoices/${target}?limit=50`);
        if (resInv.ok) {
          const dataInv = await resInv.json();
          if (dataInv.invoices && dataInv.invoices.length > 0) {
            DB.negocios.diseno.todasFacturas = dataInv.invoices;
          }
        }
      } catch(e) {}

      render();
    } else {
      if(pill) pill.innerHTML = `<span class="dot" style="background:#7A7A76;"></span> Modo Demo Local`;
    }
  } catch(err) {
    if(pill) pill.innerHTML = `<span class="dot" style="background:#7A7A76;"></span> Modo Demo Local`;
    S.apiOnline = false;
  }
}

function simulateLockoutToggle(){
  S.simulatingLockout = !S.simulatingLockout;
  const btn = document.getElementById('btn-lockout-sim');
  if(S.simulatingLockout){
    S.suspensionDetail = {
      status_code: 403,
      error: "SUBSCRIPTION_BLOCKED",
      message: "Tu suscripción se encuentra suspendida temporalmente por pago pendiente. Comunícate con Katerinn para reactivar tus reportes.",
      redirect_url: "/servicio-suspendido"
    };
    S.view = 'suspended';
    if(btn) btn.textContent = "Desactivar Bloqueo 403";
  } else {
    S.suspensionDetail = null;
    S.view = 'dashboard';
    if(btn) btn.textContent = "Simular Bloqueo 403";
    syncWithBackend();
  }
  render();
}

function setMode(m){ S.mode = m; S.view = (m==='admin') ? 'adminLista' : (S.loggedIn ? 'dashboard' : 'login'); render(); }
function resetDemo(){
  S = { mode:S.mode, loggedIn:false, view:'dashboard', negocioActivo:'diseno', periodoIdx:0, adminFiltro:'todos', adminSelected:null, subscription:null, suspensionDetail:null, apiOnline:false, historialGroup:'Todas', historialSearch:'', simulatingLockout:false, telegramBotUsername:S.telegramBotUsername };
  if(S.mode==='admin'){ S.view='adminLista'; }
  const btn = document.getElementById('btn-lockout-sim');
  if(btn) btn.textContent = "Simular Bloqueo 403";
  render();
}
function goto(view){ S.view = view; document.getElementById('app').scrollTop = 0; render(); }
function changePeriodo(delta){
  const arr = DB.negocios[S.negocioActivo].periodosIVA;
  S.periodoIdx = Math.min(arr.length-1, Math.max(0, S.periodoIdx + delta));
  render();
}
function logout(){ S.loggedIn=false; S.view='dashboard'; render(); }
function selectAdminClient(idx){ S.adminSelected = idx; render(); }
function filterAdmin(f){ S.adminFiltro = f; render(); }

/* =========================================================
   SHELL / NAV
========================================================= */
function bottomNav(active){
  const items = [
    {key:'dashboard', label:'Inicio', icon:'home'},
    {key:'ivaDetail', label:'IVA', icon:'doc'},
    {key:'hub', label:'Más', icon:'grid'},
  ];
  return `<div class="bottom-nav">${items.map(it=>`
    <button class="nav-item ${active===it.key?'active':''}" onclick="goto('${it.key}')">
      ${ic(it.icon)}
      <span>${it.label}</span>
    </button>`).join('')}</div>`;
}

function statusbarHtml(dark){
  const c = dark ? '#fff' : '#1a1a1a';
  const signal = `<svg width="18" height="12" viewBox="0 0 18 12" fill="${c}"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>`;
  const wifi = `<svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0113 0"/><path d="M4 7.2a6 6 0 018 0"/><circle cx="8" cy="10.2" r="1" fill="${c}" stroke="none"/></svg>`;
  const battery = `<svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="2.5" stroke="${c}" stroke-width="1.2"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.2" fill="${c}"/><rect x="22" y="4" width="1.8" height="4" rx="0.9" fill="${c}"/></svg>`;
  return `<div class="statusbar" style="color:${c}">
    <span>9:41</span>
    <span style="display:flex; gap:6px; align-items:center;">${signal}${wifi}${battery}</span>
  </div>`;
}

/* =========================================================
   PANTALLAS — EMPRENDEDOR
========================================================= */
function screenLogin(){
  // El @username del bot se resuelve en tiempo real contra la API de Telegram (loadBotConfig()),
  // usando el TELEGRAM_BOT_TOKEN real del .env — nunca un nombre de bot inventado o genérico,
  // que en Telegram podría pertenecer a un tercero.
  const telegramCta = S.telegramBotUsername

function ringSvg(pct, color){
  const r=42, c=2*Math.PI*r;
  return `<svg width="110" height="110" viewBox="0 0 110 110">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="#EFEDE7" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 55 55)"/>
  </svg>`;
}

  S.historialGroup = grp;

function filterInvoices(q){
  S.historialSearch = q.toLowerCase();
  render();
}

function getFilteredInvoicesList(){
  const n = DB.negocios[S.negocioActivo];
  let list = (n.todasFacturas && n.todasFacturas.length > 0) ? n.todasFacturas : n.facturasRecientes;
  
  if(S.historialGroup && S.historialGroup !== 'Todas'){
    list = list.filter(f => (f.group_type || f.tipo || 'Emitido') === S.historialGroup);
  }
  if(S.historialSearch){
    list = list.filter(f => (f.cliente || '').toLowerCase().includes(S.historialSearch) || (f.num || '').toLowerCase().includes(S.historialSearch));
  }
  return list;
}

      <h1 style="margin:0; font-family:var(--font-display); font-size:24px; font-weight:600;">Tus clientes Kontable</h1>
      <div style="display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border-radius:12px; padding:10px 14px; margin-top:16px;">

          <div style="width:42px; height:42px; border-radius:50%; background:var(--beige); color:var(--verde); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;">${c.id}</div>
          <div style="flex:1; min-width:0;">

/* =========================================================
   RENDER PRINCIPAL
========================================================= */
function render(){
  document.getElementById('btn-mode-emprendedor').classList.toggle('active', S.mode==='emprendedor');
  document.getElementById('btn-mode-admin').classList.toggle('active', S.mode==='admin');
  const app = document.getElementById('app');
  let html = '';

  if(S.mode === 'admin'){
    html = statusbarHtml(S.adminSelected===null) + (S.adminSelected===null ? screenAdminLista() : screenAdminDetail());
  } else {
    if(!S.loggedIn){
      html = statusbarHtml(false) + screenLogin();
    } else {
      const screens = {
        dashboard: screenDashboard, ivaDetail: screenIvaDetail, hub: screenHub,
        calendario: screenCalendario, historial: screenHistorial, perfil: screenPerfil,
        suspended: screenSuspended
      };
      const withNav = ['dashboard','ivaDetail','hub'].includes(S.view);
      const dark = ['dashboard','ivaDetail'].includes(S.view) || S.view==='hub' ? false : false;
      html = `<div style="display:flex; flex-direction:column; min-height:100%;">
                <div style="flex:1;">${statusbarHtml(['dashboard','ivaDetail'].includes(S.view))}${(screens[S.view]||screenDashboard)()}</div>
              </div>`;
      if(withNav) html += '';
    }
  }
  app.innerHTML = html;

  // bottom nav needs to sit fixed within wrapper, so re-structure:
  if(S.mode==='emprendedor' && S.loggedIn && !['suspended'].includes(S.view)){
    const withNav = ['dashboard','ivaDetail','hub'].includes(S.view);
    if(withNav){
      const wrapper = document.querySelector('.screen-wrapper');
      let existingNav = document.getElementById('bottom-nav-slot');
      if(existingNav) existingNav.remove();
      const navDiv = document.createElement('div');
      navDiv.id = 'bottom-nav-slot';
      navDiv.innerHTML = bottomNav(S.view);
      wrapper.appendChild(navDiv);
    } else {
      let existingNav = document.getElementById('bottom-nav-slot');
      if(existingNav) existingNav.remove();
    }
  } else {
    let existingNav = document.getElementById('bottom-nav-slot');
    if(existingNav) existingNav.remove();
  }
}

/* Enlace directo desde Telegram (?nit=<nit>): abre ya autenticado en el dashboard del cliente,
   igual que el resto del flujo de Deep Linking (sin fricción de OTP). */
const linkedNit = new URLSearchParams(location.search).get('nit');
if(linkedNit){
  S.loggedIn = true;
  S.view = 'dashboard';
}

/* Resuelve el @username real del bot (el del TELEGRAM_BOT_TOKEN configurado en .env) para que
   el botón "Abrir mi chat de Telegram" del login nunca apunte a un bot inventado o de un tercero. */
async function loadBotConfig(){
  try {
    const res = await fetch(`${API_BASE}/api/config`);
    if(res.ok){
      const data = await res.json();
      S.telegramBotUsername = data.telegram_bot_username || null;
      if(!S.loggedIn) render();
    }
  } catch(e) { /* Sin backend disponible: se mantiene el fallback de contacto por WhatsApp. */ }
}

render();
// Sin ?nit= (no venimos de un enlace real de Telegram) no hay negocio que sincronizar todavía:
// evita pegarle a la API con el NIT de demo ficticio del prototipo estático.
if(linkedNit){
  syncWithBackend(linkedNit);
}
loadBotConfig();
</script>
